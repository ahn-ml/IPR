# @package _global_
defaults:
  - /main
  - /experiment: ms1000_28
  - _self_

seed: 35

data_loader:
  test:
    batch_size: 500

checkpointing:
  load: outputs/ms1000_28/paper/checkpoints/last.ckpt

hydra:
  run:
    dir: ./experiments/ms_test/outputs

wandb:
  activated: false
  project: "ms_test"
  entity: ""
  mode: "online"
  tags: []

test:
  my_test:
    name: mnist_sudoku
    num_fill: [0, 26] # hard:[0, 26], medium: [27, 53], easy: [54, 80]      
    num_samples: 1
    save_samples: false
    sampling_video: false
    
    samplers:
      ipr_sampler_test:
        name: ipr_sampler
        max_batch_size: 32
        task_name: mnist_sudoku
        immediate_stop: false

        # ipr config
        visualize: true
        max_ipr_budget: 30
        resampling_ratio: 0.25
        ipr_overlap: 0.8
        ipr_steps_per_patch: 10

        # srm config
        patch_order: "greedy"
        overlap: 0
        epsilon: 1e-6
        top_k: 1
        use_ema: true
        steps_per_patch: 3
        stochasticity: 0.5
        temperature: 1.0